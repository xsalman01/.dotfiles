## WirePlumber config for the virtual-sinks script.
##
## Install: ~/.config/wireplumber/wireplumber.conf.d/50_virtual_sinks.conf

## ---------------------------------------------------------------------------
## Register the Lua script as a WirePlumber component.
## ---------------------------------------------------------------------------
wireplumber.components = [
  {
    name = virtual-sinks.lua, type = script/lua
    provides = virtual-sinks.script
    requires = [ metadata.default ]
  }
]

## ---------------------------------------------------------------------------
## Pull the component into the main profile. Without this, the component is
## defined but never started.
## ---------------------------------------------------------------------------
wireplumber.profiles = {
  main = {
    virtual-sinks.script = required
  }
}

## ---------------------------------------------------------------------------
## Route chat / voice-call apps to chat_sink.
##
## Exact string match by default, `~` prefix = regex. Multiple properties in
## one `{}` = AND; multiple `{}` in `matches` = OR.
## To find an app's real application.name: run `pactl list sink-inputs` while
## it is playing audio and look for `application.name =`.
## ---------------------------------------------------------------------------
stream.rules = [
  {
    matches = [
      { application.name = "Slack",         media.class = "Stream/Output/Audio" }
      { application.name = "Zoom",          media.class = "Stream/Output/Audio" }
      { application.name = "Discord",       media.class = "Stream/Output/Audio" }
      { application.name = "Telegram",      media.class = "Stream/Output/Audio" }
      { application.name = "telegram-desktop", media.class = "Stream/Output/Audio" }
      { application.name = "Microsoft Teams", media.class = "Stream/Output/Audio" }
      { application.name = "teams",         media.class = "Stream/Output/Audio" }
      { application.name = "WebCord",       media.class = "Stream/Output/Audio" }
      { application.name = "Mumble",        media.class = "Stream/Output/Audio" }
      { application.name = "mumble",        media.class = "Stream/Output/Audio" }
      { application.name = "Jami",          media.class = "Stream/Output/Audio" }
      { application.name = "Signal",        media.class = "Stream/Output/Audio" }
      { application.name = "signal",        media.class = "Stream/Output/Audio" }
    ]
    actions = {
      update-props = {
        target.object = "chat_sink"
      }
    }
  }
  ## Catch-all for streams that declare the Communication media.role
  ## (browser-based Meet / Discord-web / Teams-web call audio, etc.).
  {
    matches = [
      { media.role = "Communication", media.class = "Stream/Output/Audio" }
    ]
    actions = {
      update-props = {
        target.object = "chat_sink"
      }
    }
  }
]
